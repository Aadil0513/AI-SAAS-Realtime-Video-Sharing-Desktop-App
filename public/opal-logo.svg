  <path d="M20 35 L80 35" stroke="#FFFFFF" stroke-width="1.5" opacity="0.6" />
  <path d="M20 65 L80 65" stroke="#FFFFFF" stroke-width="1.5" opacity="0.6" />
  <path d="M50 15 L20 35 L50 50 L80 35 Z" fill="none" stroke="#FFFFFF" stroke-width="1.5" opacity="0.6" />
  <path d="M50 85 L20 65 L50 50 L80 65 Z" fill="none" stroke="#FFFFFF" stroke-width="1.5" opacity="0.6" />
</svg>
